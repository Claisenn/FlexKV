name: pr checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: ['ci/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: python -m pip install ruff==0.9.3

      - name: Lint changed Python files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags origin "$base_sha"
          else
            git fetch --no-tags origin main
            base_sha="origin/main"
          fi

          if ! merge_base="$(git merge-base HEAD "$base_sha")"; then
            echo "Unable to determine a merge base with $base_sha; skipping changed-file lint."
            exit 0
          fi

          mapfile -t python_files < <(git diff --name-only --diff-filter=d "$merge_base"...HEAD -- '*.py')

          if [[ ${#python_files[@]} -eq 0 ]]; then
            echo "No changed Python files to lint."
            exit 0
          fi

          printf 'Linting changed Python files:\n'
          printf '%s\n' "${python_files[@]}"
          python -m ruff check "${python_files[@]}"

  test-no-gpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Linux environment
        run: bash -x .github/workflows/scripts/env.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install CUDA 12.4
        run: bash -x .github/workflows/scripts/cuda-install.sh 12.4 ubuntu-22.04

      - name: Install PyTorch 2.6.0 with CUDA 12.4
        run: bash -x .github/workflows/scripts/pytorch-install.sh 3.10 2.6.0 12.4

      - name: Build wheel
        env:
          TORCH_CUDA_ARCH_LIST: "8.9 9.0+PTX"
          MAX_JOBS: 4
        run: ./build.sh --release

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install dist/*.whl

      - name: Run no-GPU tests
        run: pytest tests/ -m "unit or smoke" -v --tb=short
